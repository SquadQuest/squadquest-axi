name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22.22.3'

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.0'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type check
      run: bun run check

    - name: Build
      run: bun run build

    - name: Test
      run: bun run test

    - name: Check the generated skill is current
      # SKILL.md is generated from src/reference.ts, so a hand-edit or a
      # forgotten regeneration would silently ship stale docs.
      run: bun run docs:check

    - name: Smoke test the built bundle
      # `--version` alone is not enough — it never reaches command dispatch.
      # Running a real command with no credentials exercises dispatch, flag
      # parsing, and the error-formatting path, and must produce a structured
      # error rather than a crash or a raw stack trace. While commands are
      # stubs this fires NOT_IMPLEMENTED; once implemented it becomes the
      # credential check (NO_SESSION) — either way: structured, exit 2 (both are usage-class).
      run: |
        node dist/bin/squadquest-axi.js --version
        node dist/bin/squadquest-axi.js --help > /dev/null

        set +e
        out=$(SQUADQUEST_AXI_CONFIG_DIR=/tmp/squadquest-axi-smoke node dist/bin/squadquest-axi.js friends 2>&1)
        code=$?
        set -e
        echo "$out"

        if [ "$code" -ne 2 ]; then
          echo "::error::expected exit 2, got $code"
          exit 1
        fi
        if ! echo "$out" | grep -qE 'code: (NOT_IMPLEMENTED|NO_SESSION)'; then
          echo "::error::expected a structured NOT_IMPLEMENTED or NO_SESSION error"
          exit 1
        fi

        # A leaked stack trace means an unhandled failure reached stdout, where
        # an agent would try to read it as data.
        if echo "$out" | grep -qE '^\s+at |node:internal'; then
          echo "::error::a raw stack trace leaked to stdout"
          exit 1
        fi

        echo "smoke test passed"
